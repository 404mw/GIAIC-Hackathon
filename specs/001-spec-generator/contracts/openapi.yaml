openapi: 3.0.3
info:
  title: Book Platform RAG API
  description: API for the RAG-based chatbot for the 'Physical AI & Humanoid Robotics' book.
  version: 1.0.0

paths:
  /api/chat:
    post:
      summary: Get an answer from the RAG model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The user's question.
                conversation_history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                  description: Optional history of the conversation for context.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    description: The model's answer.
                  sources:
                    type: array
                    items:
                      type: string
                      description: A list of source documents used to generate the answer.
        '422':
          description: Validation Error
